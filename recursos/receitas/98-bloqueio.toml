[modulo]
id = "98"
nome = "bloqueio"
titulo = "锁屏"
afetada_por = ["bloqueio"]

# 负责锁定的是 light-locker，它已随 XFCE 出现在 Debian 中。它不
# 绘制自己的界面：而是把显示器交还给 LightDM，因此锁定使用与
# 登录界面相同的 greeter 和相同的外观。
#
# 锁定前的等待时间由 X 屏幕保护决定。light-locker 在它触发时
# 锁定，并留出五秒移动鼠标。xfce4-power-manager 4.20 不再有
# 该时间的键，所以用 xset。

# 两边都会改动的 light-locker 键的之前的值
[[passo]]
tipo = "script"
tolera_falha = true
corpo = '''
for chave in lock-after-screensaver lock-on-suspend lock-on-lid; do d3_gsettings apps.light-locker "$chave"; done
'''

# ---- 启用锁定 --------------------------------------------------------------

[[passo]]
tipo = "apt"
se = "bloqueio != nao"
pacotes = ["light-locker"]

[[passo]]
tipo = "comando"
se = "bloqueio != nao"
dizer = "闲置 @@bloqueio@@ 分钟后、挂起时和合上盖子时锁定"
tolera_falha = true
argumentos = ["gsettings", "set", "apps.light-locker", "lock-after-screensaver", "5"]

[[passo]]
tipo = "comando"
se = "bloqueio != nao"
tolera_falha = true
argumentos = ["gsettings", "set", "apps.light-locker", "lock-on-suspend", "true"]

[[passo]]
tipo = "comando"
se = "bloqueio != nao"
tolera_falha = true
argumentos = ["gsettings", "set", "apps.light-locker", "lock-on-lid", "true"]

[[passo]]
tipo = "script"
se = "bloqueio != nao"
corpo = '''
d3_xfconf xfce4-screensaver /lock/sleep-activation bool
'''

[[passo]]
tipo = "xfconf"
se = "bloqueio != nao"
canal = "xfce4-power-manager"
chave = "/xfce4-power-manager/lock-screen-suspend-hibernate"
tipo_valor = "bool"
valor = "true"

# xset 不会在会话结束后存活；autostart 每次进入时重新执行
[[passo]]
tipo = "autostart"
se = "bloqueio != nao"
id = "d3bian-bloqueio"
nome = "锁屏前的等待时间"
comando = "xset s @@bloqueio_segundos@@ @@bloqueio_segundos@@"

[[passo]]
tipo = "comando"
se = "bloqueio != nao"
tolera_falha = true
argumentos = ["xset", "s", "@@bloqueio_segundos@@", "@@bloqueio_segundos@@"]

# 用户文件夹中唯一的 light-locker.desktop 是"nao"写入的那个
[[passo]]
tipo = "autostart"
se = "bloqueio != nao"
id = "light-locker"
remover = true

[[passo]]
tipo = "processo"
se = "bloqueio != nao"
nome = "light-locker"
acao = "reiniciar"

# ---- 不启用锁定 ------------------------------------------------------------

[[passo]]
tipo = "arquivo"
se = "bloqueio == nao"
dizer = "关闭自动锁定"
destino = "~/.config/autostart/light-locker.desktop"
conteudo = '''
[Desktop Entry]
Type=Application
Name=Screen Locker
Exec=light-locker
Hidden=true
'''

[[passo]]
tipo = "autostart"
se = "bloqueio == nao"
id = "d3bian-bloqueio"
remover = true

[[passo]]
tipo = "comando"
se = "bloqueio == nao"
tolera_falha = true
argumentos = ["gsettings", "set", "apps.light-locker", "lock-on-suspend", "false"]

[[passo]]
tipo = "script"
se = "bloqueio == nao"
corpo = '''
d3_xfconf xfce4-screensaver /lock/sleep-activation bool
'''

[[passo]]
tipo = "xfconf"
se = "bloqueio == nao"
canal = "xfce4-power-manager"
chave = "/xfce4-power-manager/lock-screen-suspend-hibernate"
tipo_valor = "bool"
valor = "false"

[[passo]]
tipo = "processo"
se = "bloqueio == nao"
nome = "light-locker"
acao = "parar"
