[modulo]
id = "90"
nome = "efeitos"
titulo = "阴影、圆角和透明度"
afetada_por = ["efeitos"]

[[passo]]
tipo = "processo"
se = "efeitos != sim"
nome = "picom"
acao = "parar"

[[passo]]
tipo = "autostart"
se = "efeitos != sim"
id = "picom"
remover = true

# 没有 picom 时，合成重新交给 XFCE 自己，否则完全没有阴影
[[passo]]
tipo = "xfconf"
se = "efeitos != sim"
canal = "xfwm4"
chave = "/general/use_compositing"
tipo_valor = "bool"
valor = "true"

[[passo]]
tipo = "apt"
se = "efeitos == sim"
pacotes = ["picom"]

# 模板在物理机上选择 glx，在没有 vsync 的虚拟机上选择 xrender，
# 因为虚拟机里 glx 会停止重绘窗口
[[passo]]
tipo = "arquivo"
se = "efeitos == sim"
destino = "~/.config/picom.conf"
modelo = "picom.conf"

# 两个合成器同时运行会导致屏幕撕裂
[[passo]]
tipo = "xfconf"
se = "efeitos == sim"
canal = "xfwm4"
chave = "/general/use_compositing"
tipo_valor = "bool"
valor = "false"

[[passo]]
tipo = "autostart"
se = "efeitos == sim"
id = "picom"
nome = "窗口特效"
comando = "picom --config @@HOME@@/.config/picom.conf"

[[passo]]
tipo = "processo"
se = "efeitos == sim"
nome = "picom"
acao = "reiniciar"
argumentos = ["picom", "--config", "@@HOME@@/.config/picom.conf"]
