[modulo]
id = "80"
nome = "widget"
titulo = "桌面上的时钟和状态小部件"
afetada_por = ["widget", "destaque"]

# widget：sim 是简单版，aneis 是改编自 MX-CoreBlue 的版本，不可关闭

[[passo]]
tipo = "processo"
se = "widget == nao"
nome = "conky"
acao = "parar"

[[passo]]
tipo = "autostart"
se = "widget == nao"
id = "conky"
remover = true

[[passo]]
tipo = "apt"
se = "widget != nao"
pacotes = ["conky-all"]

# --- 简单版 ----------------------------------------------------------------

[[passo]]
tipo = "arquivo"
se = "widget == sim"
destino = "~/.config/conky/d3bian.conf"
modelo = "conky.conf"

[[passo]]
tipo = "autostart"
se = "widget == sim"
id = "conky"
nome = "桌面小部件"
comando = "conky -c @@HOME@@/.config/conky/d3bian.conf"

[[passo]]
tipo = "processo"
se = "widget == sim"
nome = "conky"
acao = "reiniciar"
argumentos = ["conky", "-c", "@@HOME@@/.config/conky/d3bian.conf"]

# --- 环形 ------------------------------------------------------------------

[[passo]]
tipo = "arquivo"
se = "widget == aneis"
destino = "~/.config/conky/d3bian-aneis.lua"
modelo = "conky-aneis.lua"

[[passo]]
tipo = "arquivo"
se = "widget == aneis"
destino = "~/.config/conky/d3bian-aneis.conf"
modelo = "conky-aneis.conf"

[[passo]]
tipo = "autostart"
se = "widget == aneis"
id = "conky"
nome = "桌面小部件"
comando = "conky -c @@HOME@@/.config/conky/d3bian-aneis.conf"

[[passo]]
tipo = "processo"
se = "widget == aneis"
nome = "conky"
acao = "reiniciar"
argumentos = ["conky", "-c", "@@HOME@@/.config/conky/d3bian-aneis.conf"]
