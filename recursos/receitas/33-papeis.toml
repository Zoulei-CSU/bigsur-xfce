[modulo]
id = "33"
nome = "papeis"
titulo = "Big Sur 壁纸"
requer = ["10"]

# 固定提交（2026-10-06 的 main）：实际运行且已核对过的版本。要
# 更新：git ls-remote https://github.com/vinceliuice/WhiteSur-wallpapers.git main
[[passo]]
tipo = "git"
url = "https://github.com/vinceliuice/WhiteSur-wallpapers.git"
ref = "5c1d7ca20b8de0a7efe443792c19e49277262e02"
destino = "@@fontes@@/WhiteSur-wallpapers"

[[passo]]
tipo = "script"
dizer = "复制壁纸"
corpo = '''
destino="$HOME/.local/share/backgrounds/WhiteSur"
d3_antes "$destino"
mkdir -p "$destino"
find "$D3_FONTES/WhiteSur-wallpapers" -type f \( -iname '*.jpg' -o -iname '*.png' \) \
     ! -iname 'preview-*' ! -ipath '*4k*' -exec cp -f {} "$destino/" \; 2>/dev/null || true
echo "可用壁纸：$(find "$destino" -type f | wc -l) 张"
# 登录界面的背景由配方 97 选择和准备
'''
