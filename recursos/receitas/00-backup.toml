[modulo]
id = "00"
nome = "backup"
titulo = "备份当前已有的内容"
afetada_por = []

[[passo]]
tipo = "backup"
dizer = "保存当前配置"
caminhos = [
  "~/.config/xfce4",
  "~/.config/autostart",
  "~/.config/gtk-3.0",
  "~/.config/gtk-4.0",
  "~/.config/Kvantum",
  "~/.config/plank",
  "~/.config/rofi",
  "~/.config/conky",
  "~/.config/picom.conf",
  "~/.gtkrc-2.0",
  "~/.xsessionrc",
  "/etc/lightdm",
]

[[passo]]
tipo = "script"
dizer = "记录 xfconf 的状态，方便以后查看"
tolera_falha = true
corpo = '''
# 放在备份文件夹之外：恢复时会把这里的内容还原到同一路径
# （相对于根目录），这里只是记录
destino="$D3_ESTADO_DIR/xfconf-antes"
mkdir -p "$destino"
xfconf-query -l | tail -n +2 | while read -r canal; do
  canal="$(printf '%s' "$canal" | tr -d ' ')"
  [ -n "$canal" ] && xfconf-query -c "$canal" -lv > "$destino/$canal.txt" 2>/dev/null
done
dpkg-query -W -f='${binary:Package}\n' > "$D3_ESTADO_DIR/pacotes-antes.txt" 2>/dev/null || true
echo "已记录 xfconf 状态"
'''
