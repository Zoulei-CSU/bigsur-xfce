[modulo]
id = "97"
nome = "login"
titulo = "登录和锁屏界面"
requer = ["30"]
afetada_por = ["destaque", "papel_de_parede",
               "login_fundo", "login_desfoque", "login_escurecer", "login_usuarios"]

# 文件先组装到 @@login_dir@@，一个每次执行时由 receitas.py 新建、
# 私有（0700）且结束时删除的新文件夹，然后经过一个新建的 root
# 文件夹带到系统。预览用 login_instalar = nao 和另一个文件夹运行
# 这些相同的步骤，因此它显示的内容正是将要安装的内容。

[[passo]]
tipo = "apt"
se = "login_instalar == sim"
pacotes = ["lightdm-gtk-greeter"]

# 组装文件夹必须是本次执行的：新建、属于用户、私有且不是链接。
# 开始时为空（文件夹保留；/tmp 中的空闲名称可能被其他账户占用）
[[passo]]
tipo = "script"
corpo = '''
d="${D3_LOGIN_DIR:-}"
if [ -z "$d" ] || [ -L "$d" ] || [ ! -d "$d" ] || [ ! -O "$d" ] \
   || [ "$(stat -c %a "$d")" != 700 ]; then
  echo "登录组装文件夹无效：${d:-空}" >&2
  exit 1
fi
find "$d" -mindepth 1 -delete
'''

[[passo]]
tipo = "arquivo"
dizer = "组装登录界面主题"
destino = "@@login_dir@@/share/themes/d3bian-login/gtk-3.0/gtk.css"
modelo = "login-gtk.css"

[[passo]]
tipo = "arquivo"
destino = "@@login_dir@@/xdg/lightdm/lightdm-gtk-greeter.conf.d/90-d3bian.conf"
modelo = "login-greeter.conf"

[[passo]]
tipo = "arquivo"
destino = "@@login_dir@@/lightdm.conf.d/90-d3bian.conf"
conteudo = '''
# 由 d3bian-init-bigsur-xfce 写入。
[Seat:*]
greeter-session=lightdm-gtk-greeter
# true 显示用户名和密码字段；false 显示用户列表
greeter-hide-users=@@login_esconder_usuarios@@
greeter-show-manual-login=true
user-session=xfce
'''

[[passo]]
tipo = "script"
dizer = "准备背景和照片"
corpo = '''
d="$D3_LOGIN_DIR"
rm -f "$d/fundo.jpg" "$d/avatar.png"

origem="$D3_LOGIN_FUNDO_ARQUIVO"
if [ -n "$origem" ] && [ -f "$origem" ]; then
  # 白色文字背后背景要调暗多少由用户决定
  esc="${D3_LOGIN_ESCURECER:-10}"
  case "$esc" in ''|*[!0-9]*) esc=10 ;; esac
  [ "$esc" -le 90 ] || esc=90
  if [ "$D3_LOGIN_DESFOQUE" = "sim" ]; then
    # 先缩小再模糊可让模糊变快；greeter 会把它拉回
    convert "$origem[0]" -resize '1920x1200^' -blur 0x24 -fill black -colorize "$esc%" \
            -quality 88 "$d/fundo.jpg"
  else
    convert "$origem[0]" -resize '2560x1600>' -fill black -colorize "$esc%" -quality 90 "$d/fundo.jpg"
  fi
  echo "背景：$(basename "$origem")$([ "$D3_LOGIN_DESFOQUE" = "sim" ] && echo '，已模糊')，已调暗 $esc%"
else
  convert -size 1920x1200 gradient:'#2a3a52'-'#0b0f16' "$d/fundo.jpg"
  echo "没找到背景图片；使用深色渐变"
fi

# 圆形照片。标志的 svg 没有背景，因此加上一个玻璃圆盘
avatar="$D3_LOGIN_AVATAR_ARQUIVO"
mascara=( \( -size 256x256 xc:none -fill white -draw 'circle 128,128 128,1' \) -compose DstIn -composite )
case "$avatar" in
  *.svg)
    convert -background none -density 384 "$avatar" -resize 140x140 \
            -gravity center -background 'rgba(255,255,255,0.18)' -extent 256x256 \
            "${mascara[@]}" "$d/avatar.png" ;;
  *)
    convert "$avatar[0]" -resize '256x256^' -gravity center -extent 256x256 \
            "${mascara[@]}" "$d/avatar.png" ;;
esac
echo "照片：$(basename "$avatar")"
'''

[[passo]]
tipo = "backup"
se = "login_instalar == sim"
caminhos = ["/etc/lightdm/lightdm.conf.d/90-d3bian.conf"]

[[passo]]
tipo = "script"
se = "login_instalar == sim"
dizer = "带到系统"
corpo = '''
d="$D3_LOGIN_DIR"
tema=/usr/share/themes/d3bian-login
# 在带到系统之前记录；撤销会逐个删除或还原
d3_antes "$D3_LOGIN_RAIZ" "$tema" /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d/90-d3bian.conf \
         /etc/lightdm/lightdm.conf.d/90-d3bian.conf
# root 先把所有内容复制到自己的新文件夹，拒绝符号
# 链接，并从那里安装：用户文件夹中的内容不会通过快捷方式
# 进入系统，也不会在核对后被替换
r="$(sudo -n mktemp -d)"
trap 'sudo -n rm -rf -- "$r"' EXIT
leva() {  # 组装文件 -> root 文件夹中的名字
  if [ -L "$d/$1" ] || [ ! -f "$d/$1" ]; then echo "已拒绝：$d/$1" >&2; exit 1; fi
  sudo -n cp -P --no-preserve=all -- "$d/$1" "$r/$2"
  sudo -n test -f "$r/$2" -a ! -L "$r/$2" || { echo "已拒绝：$d/$1" >&2; exit 1; }
}
leva fundo.jpg fundo.jpg
leva avatar.png avatar.png
leva share/themes/d3bian-login/gtk-3.0/gtk.css gtk.css
leva xdg/lightdm/lightdm-gtk-greeter.conf.d/90-d3bian.conf greeter.conf
leva lightdm.conf.d/90-d3bian.conf lightdm.conf
sudo -n install -d -m 755 "$D3_LOGIN_RAIZ" "$tema/gtk-3.0" \
     /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d /etc/lightdm/lightdm.conf.d
sudo -n install -o root -g root -m 644 "$r/fundo.jpg" "$r/avatar.png" "$D3_LOGIN_RAIZ/"
sudo -n install -o root -g root -m 644 -T "$r/gtk.css" "$tema/gtk-3.0/gtk.css"
sudo -n install -o root -g root -m 644 -T "$r/greeter.conf" \
     /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d/90-d3bian.conf
sudo -n install -o root -g root -m 644 -T "$r/lightdm.conf" /etc/lightdm/lightdm.conf.d/90-d3bian.conf
sudo -n rm -rf -- "$r"
trap - EXIT

# 不要把"无法核对"和"出错了"混为一谈：lightdm --show-config
# 需要 root，而且正在使用的 greeter 只在 LightDM 重启时改变，
# 因为它只在启动时读取一次配置。
saida="$(sudo -n lightdm --show-config 2>&1 || true)"
if [ -z "$saida" ]; then
  echo "已配置；没有 root 无法核对"
elif printf '%s\n' "$saida" | grep -q 'greeter-session=lightdm-gtk-greeter'; then
  echo "已配置并经 lightdm 确认"
else
  echo "atencao: lightdm 解析到了另一个 greeter，请检查 /etc/lightdm/lightdm.conf.d"
fi
echo "锁屏界面立即改变；登录界面在下次重启时改变"
echo "如果登录失败，用 Ctrl+Alt+F2 进入文本模式并运行："
echo "  sudo rm /etc/lightdm/lightdm.conf.d/90-d3bian.conf && sudo systemctl restart lightdm"
'''
