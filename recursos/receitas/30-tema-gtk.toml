[modulo]
id = "30"
nome = "tema-gtk"
titulo = "窗口的 WhiteSur 主题"
requer = ["10"]
afetada_por = ["destaque"]

# 固定提交（2026-10-06 的 master）：实际运行且已核对过的版本。要
# 更新：git ls-remote https://github.com/vinceliuice/WhiteSur-gtk-theme.git master
[[passo]]
tipo = "git"
url = "https://github.com/vinceliuice/WhiteSur-gtk-theme.git"
ref = "d5782652d412137e26fb8ff55b55a5572e4c6995"
destino = "@@fontes@@/WhiteSur-gtk-theme"

[[passo]]
tipo = "script"
dizer = "编译并安装，这是最耗时的部分"
corpo = '''
cd "$D3_FONTES/WhiteSur-gtk-theme"
# 在记录其中任何主题之前：撤销是倒序进行的
d3_pasta "$HOME/.themes"
# 在安装前记录，以便撤销知道哪些属于该项目
for v in Light Dark; do
  d3_antes "$HOME/.themes/WhiteSur-$v" "$HOME/.themes/WhiteSur-$v$D3_GTK_SUFIXO"
done
# 安装程序会调整 whiskermenu 的 .rc 里的菜单不透明度
for f in "$HOME"/.config/xfce4/panel/whiskermenu*.rc; do
  if [ -e "$f" ]; then d3_antes "$f"; fi
done
# 它还会安装 gnome-theme-switcher 以及 -hdpi 和 -xhdpi 变体
extras=("$HOME/.themes/WhiteSur-*hdpi" "$HOME/.local/bin/gnome-theme-switcher"
        "$HOME/.local/share/applications/org.gnome.GTK4ThemeSwitcher.desktop")
d3_antes_de "${extras[@]}"
# --silent-mode 需要 root，所以这里不用
bash ./install.sh -c light -c dark -t "$D3_DESTAQUE_EXTERNO" -o normal -a normal --round
d3_depois_de "${extras[@]}"
'''

[[passo]]
tipo = "script"
dizer = "复制到 /usr/share/themes，登录界面需要它"
tolera_falha = true
corpo = '''
# 也带上所选颜色的变体，因为那才是将要使用的
for t in "$HOME/.themes/WhiteSur-Light$D3_GTK_SUFIXO" \
         "$HOME/.themes/WhiteSur-Dark$D3_GTK_SUFIXO" \
         "$HOME/.themes/WhiteSur-Light" "$HOME/.themes/WhiteSur-Dark"; do
  [ -d "$t" ] || continue
  d3_antes "/usr/share/themes/$(basename "$t")"
  # root:root 且其他人不可写；经过一个新建的 root 文件夹
  # （diario.py，d3_raiz_instalar），不继承 ~/.themes 的所有者
  d3_raiz_instalar "$t" "/usr/share/themes/$(basename "$t")"
done
if [ ! -d "$HOME/.themes/$D3_GTK_TEMA" ]; then
  echo "atencao: 期望的主题 $D3_GTK_TEMA 没有被生成"
  exit 1
fi
echo "正在使用的主题：$D3_GTK_TEMA"
'''
