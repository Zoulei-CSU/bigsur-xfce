# 由 d3bian-init-bigsur-xfce 写入。放在 .conf.d 文件夹中，好让主文件
# /etc/lightdm/lightdm-gtk-greeter.conf 继续留作手动调整。
[greeter]
theme-name=d3bian-login
icon-theme-name=WhiteSur-dark
cursor-theme-name=@@cursores@@
cursor-theme-size=24
font-name=@@fonte_ui@@ 11
background=@@login_raiz@@/fundo.jpg
user-background=false
# 照片由主题绘制在输入框上方；见 gtk.css 中的注释
hide-user-image=true
indicators=~spacer;~session;~a11y;~clock;~power
clock-format=%a %d %b  %H:%M
# 锁屏时，一分钟无操作后关闭显示器
screensaver-timeout=60
